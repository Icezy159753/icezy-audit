# Copy to .github/workflows/icezy-security-scan.yml in your project.
# Fails the check when the scan finds High or Critical issues; the report appears in the run summary.
# For stricter supply-chain control, replace the @v0.1.4 tag below with the reviewed full commit SHA.
name: icezy-security-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install --disable-pip-version-check "uv>=0.4,<1"
      - name: Security scan
        run: |
          uvx --from "git+https://github.com/Icezy159753/icezy-audit.git@v0.1.4" \
            icezy-audit scan . --out "$RUNNER_TEMP/icezy-scan" --fail-on high
      - name: Publish report
        if: always()
        run: cat "$RUNNER_TEMP/icezy-scan/report.md" >> "$GITHUB_STEP_SUMMARY" || true
