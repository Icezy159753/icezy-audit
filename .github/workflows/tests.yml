name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONPATH: src
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  unit:
    name: unit-${{ matrix.os }}-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.11'
          - os: macos-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python src/icezy_audit/payload/scripts/test_security_gate.py
      - run: python src/icezy_audit/payload/scripts/test_entrypoints.py
      - run: python src/icezy_audit/payload/scripts/test_security_scan.py
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python scripts/smoke_wheel.py
